name: testovi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # svakog ponedjeljka: uhvati pakete koji su se u međuvremenu pokvarili (npr. nova verzija PyAV-a)
    - cron: "17 4 * * 1"

jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Python paketi
        run: python -m pip install -r requirements-dev.txt
      - name: Testovi
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests -q

  transkripcija:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-${{ runner.os }}
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # iste verzije kao kod Marka: najnovije što pip nađe iz requirements.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements.txt
      - run: python -m pip list
      - name: Dimni test transkripcije (whisper tiny)
        env:
          SHOFE_WHISPER_TEST: "1"
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python -m pytest tests/test_transcribe_smoke.py -q
