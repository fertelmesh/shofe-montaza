name: testovi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # svakog ponedjeljka: uhvati pakete koji su se u međuvremenu pokvarili (npr. nova verzija PyAV-a)
    - cron: "17 4 * * 1"

jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Gyan build, isti kao kod Marka (winget Gyan.FFmpeg), s GitHub izdanja; choco samo kao rezerva
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          gh release download --repo GyanD/codexffmpeg --pattern "*-essentials_build.zip" --dir $dir
          $zip = Get-ChildItem $dir -Filter "*-essentials_build.zip" | Select-Object -First 1
          if ($zip) {
            Expand-Archive $zip.FullName -DestinationPath $dir
            $bin = Get-ChildItem $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $bin.DirectoryName
          } else {
            Write-Host "Gyan build nije skinut, pokušavam choco"
            choco install ffmpeg -y --no-progress
          }
      - name: ffmpeg postoji
        run: ffmpeg -version
      - name: Python paketi
        run: python -m pip install -r requirements-dev.txt
      # preglednik za test pregled.html (JavaScript je isti na svim sustavima, dovoljno na Linuxu)
      - name: Playwright + Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      # modeli za prepoznavanje govornika i glazbe (~36 + 29 MB, GitHub izdanja sherpa-onnxa)
      # i za izdvajanje osobe (MODNet, 26 MB, GitHub izdanje HivisionIDPhotos)
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/shofe-modeli
          key: shofe-modeli-v3-${{ runner.os }}
      - name: Model osobe
        env:
          PYTHONUTF8: "1"
          SHOFE_MODELI: ${{ runner.temp }}/shofe-modeli
        run: python shofe-montaza/scripts/osoba.py preuzmi
      # HTML grafika (M5.4): Node.js 22 + HyperFrames (zakucana verzija) + njegov Chrome, kao kod Marka
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: HyperFrames
        env:
          PYTHONUTF8: "1"
          SHOFE_HYPERFRAMES: ${{ runner.temp }}/hyperframes
        run: python shofe-montaza/scripts/grafika.py instaliraj && python shofe-montaza/scripts/grafika.py proba ${{ runner.temp }}/grafika-proba
      - name: Testovi
        env:
          PYTHONUTF8: "1"
          SHOFE_GOVORNICI_TEST: "1"
          SHOFE_MODELI: ${{ runner.temp }}/shofe-modeli
          SHOFE_GRAFIKA_TEST: "1"
          SHOFE_OSOBA_TEST: "1"
          SHOFE_HYPERFRAMES: ${{ runner.temp }}/hyperframes
        run: python -m pytest tests -q -rs

  transkripcija:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-${{ runner.os }}
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Gyan build, isti kao kod Marka (winget Gyan.FFmpeg), s GitHub izdanja; choco samo kao rezerva
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ffmpeg"
          gh release download --repo GyanD/codexffmpeg --pattern "*-essentials_build.zip" --dir $dir
          $zip = Get-ChildItem $dir -Filter "*-essentials_build.zip" | Select-Object -First 1
          if ($zip) {
            Expand-Archive $zip.FullName -DestinationPath $dir
            $bin = Get-ChildItem $dir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $bin.DirectoryName
          } else {
            Write-Host "Gyan build nije skinut, pokušavam choco"
            choco install ffmpeg -y --no-progress
          }
      - name: ffmpeg postoji
        run: ffmpeg -version
      # iste verzije kao kod Marka: najnovije što pip nađe iz requirements.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements.txt
      # prava instalacija kao kod Marka (INSTALIRAJ.bat → install.ps1 u Windows PowerShellu 5.1)
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File shofe-montaza/install.ps1
      - run: python -m pip list
      - name: doctor.py (sve što Marko treba)
        env:
          PYTHONUTF8: "1"
        run: python shofe-montaza/scripts/doctor.py
      - name: Dimni test transkripcije (whisper tiny)
        env:
          SHOFE_WHISPER_TEST: "1"
          PYTHONUTF8: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python -m pytest tests/test_transcribe_smoke.py -q
